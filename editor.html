<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Kuesioner Bangkom - Admin Panel</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .dragging { opacity: 0.4; }
        .drag-over { border-top: 2px solid #3b82f6; }
        .section-color-1 { border-left: 4px solid #3b82f6; }
        .section-color-2 { border-left: 4px solid #10b981; }
        .section-color-3 { border-left: 4px solid #f59e0b; }
        .section-color-4 { border-left: 4px solid #a855f7; }
        .section-header-1 { background: linear-gradient(to right, #eff6ff, #eef2ff30); }
        .section-header-2 { background: linear-gradient(to right, #f0fdf4, #f0fdf440); }
        .section-header-3 { background: linear-gradient(to right, #fffbeb, #fffbeb40); }
        .section-header-4 { background: linear-gradient(to right, #faf5ff, #faf5ff40); }
        textarea { resize: vertical; }
        .preview-badge-1 { background:#dbeafe; color:#1d4ed8; }
        .preview-badge-2 { background:#d1fae5; color:#065f46; }
        .preview-badge-3 { background:#fef3c7; color:#92400e; }
        .preview-badge-4 { background:#f3e8ff; color:#6b21a8; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Header Admin -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-slate-100 p-1.5 flex items-center justify-center border border-slate-200">
                    <img src="favicon.png" alt="Logo LAN RI" class="w-full h-full object-contain">
                </div>
                <div>
                    <span class="text-[10px] font-bold tracking-widest uppercase bg-rose-100 text-rose-700 px-2 py-0.5 rounded">Admin Panel</span>
                    <h1 class="text-base font-extrabold text-slate-900 tracking-tight">Editor Kuesioner Bangkom</h1>
                </div>
            </div>
            <div class="flex items-center gap-2.5">
                <form id="admin-login" class="flex items-center gap-2" onsubmit="signInAdmin(event)"><input id="admin-email" type="email" autocomplete="username" required placeholder="Email admin" class="w-36 px-2 py-1.5 text-xs border border-slate-300 rounded-lg"><input id="admin-password" type="password" autocomplete="current-password" required placeholder="Kata sandi" class="w-28 px-2 py-1.5 text-xs border border-slate-300 rounded-lg"><button class="text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 text-white">Masuk</button></form>
                <span id="admin-session" class="hidden text-xs font-medium text-emerald-700"></span><button id="admin-logout" class="hidden text-xs text-slate-600 underline" onclick="signOutAdmin()">Keluar</button>
                <button onclick="exportConfig()" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 flex items-center gap-1.5 shadow-sm transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export JSON
                </button>
                <button onclick="previewSurvey()" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-blue-300 bg-blue-50 hover:bg-blue-100 text-blue-700 flex items-center gap-1.5 shadow-sm transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    Preview
                </button>
                <button id="save-config-button" onclick="applyChanges()" disabled class="text-xs font-bold opacity-50 cursor-not-allowed px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-1.5 shadow-sm shadow-emerald-600/20 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    Simpan & Terapkan
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 space-y-6">

        <!-- Info Banner -->
        <div class="bg-blue-50 border border-blue-200 rounded-xl px-5 py-3.5 flex items-start gap-3">
            <svg class="w-5 h-5 text-blue-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <div class="text-xs text-blue-800">
                <span class="font-bold block mb-0.5">Cara menggunakan Editor Kuesioner:</span>
                Masuk dengan akun admin yang sudah diaktifkan. Perubahan yang disimpan langsung dipakai halaman survei. Pastikan konfigurasi sesuai sebelum menyimpan.
            </div>
        </div>

        <!-- Editor Judul & Deskripsi Survey -->
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
            <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-slate-800 text-white text-xs flex items-center justify-center font-bold">1</span>
                Judul & Deskripsi Survei
            </h2>
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Judul Halaman Survei</label>
                    <input type="text" id="survey-title" class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500" value="Survei Kebutuhan Pengembangan Kompetensi Pegawai">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1.5">Deskripsi Survei</label>
                    <textarea id="survey-desc" rows="2" class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500">Survei ini bertujuan untuk memetakan kebutuhan pengembangan kompetensi pegawai Deputi I LAN RI pada aspek kompetensi inti. Hasilnya digunakan untuk mengidentifikasi prioritas program pelatihan dan pengembangan pegawai secara langsung dan terarah.</textarea>
                </div>
            </div>
        </div>

        <!-- Editor isi seluruh bagian form selain daftar topik Bangkom -->
        <div id="form-content-editor" class="space-y-5"></div>

        <!-- Editor Subkompetensi dan Topik Bangkom -->
        <div id="sections-container" class="space-y-5">
            <!-- Dirender dinamis oleh JS -->
        </div>

        <!-- Tombol Tambah Subkompetensi Baru -->
        <button onclick="addNewSection()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-2xl text-sm font-semibold text-slate-500 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50/30 transition flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Tambah Subkompetensi Baru
        </button>

    </main>

    <!-- Modal Preview -->
    <div id="preview-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl border border-slate-200">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 sticky top-0 bg-white z-10">
                <h2 class="font-bold text-slate-900">Preview Kuesioner</h2>
                <button onclick="document.getElementById('preview-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="preview-content" class="p-6 space-y-6 text-sm"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed bottom-5 right-5 z-50 bg-slate-900 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-lg flex items-center gap-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Tersimpan!</span>
    </div>

    <script>
        // ============================================================
        // DATA KUESIONER (Edit di sini atau via UI)
        // ============================================================
        let surveyData = {
                    "sections": [
                                {
                                            "id": 1,
                                            "title": "Analisis Kebijakan",
                                            "color": 1,
                                            "topics": [
                                                        {
                                                                    "value": "Riset & Analisis Kebijakan",
                                                                    "desc": "Identifikasi masalah; perumusan pertanyaan; pengolahan data; penyusunan policy brief/paper."
                                                        },
                                                        {
                                                                    "value": "Perumusan Kebijakan Publik",
                                                                    "desc": "Penyusunan alternatif kebijakan; cost-benefit analisis; rekomendasi naskah kebijakan."
                                                        },
                                                        {
                                                                    "value": "Policy Impact Assessment",
                                                                    "desc": "Penilaian dampak ekonomi; sosial; kelembagaan; serta indikator dampak kebijakan."
                                                        },
                                                        {
                                                                    "value": "Monitoring & Evaluasi Kebijakan",
                                                                    "desc": "Desain monitoring; indikator kinerja kebijakan; evaluasi efektivitas dan efisiensi."
                                                        }
                                            ]
                                },
                                {
                                            "id": 2,
                                            "title": "Advokasi Kebijakan",
                                            "color": 2,
                                            "topics": [
                                                        {
                                                                    "value": "Advokasi & Komunikasi Kebijakan",
                                                                    "desc": "Strategi advokasi; pemetaan aktor; penyusunan pesan; policy pitching."
                                                        },
                                                        {
                                                                    "value": "Stakeholder Engagement (Kebijakan)",
                                                                    "desc": "Analisis kepentingan/pengaruh stakeholder; teknik kolaborasi; pengelolaan konflik."
                                                        },
                                                        {
                                                                    "value": "Public Consultation",
                                                                    "desc": "Desain instrumen konsultasi publik; fasilitasi forum; integrasi hasil konsultasi."
                                                        },
                                                        {
                                                                    "value": "Regulatory Impact Assessment (RIA)",
                                                                    "desc": "Identifikasi masalah regulasi; penyusunan opsi regulasi; analisis dampak alternatif regulasi."
                                                        },
                                                        {
                                                                    "value": "Legal Drafting",
                                                                    "desc": "Teknik penyusunan peraturan; perumusan norma hukum; harmonisasi & sinkronisasi regulasi."
                                                        },
                                                        {
                                                                    "value": "Inovasi Kebijakan & Program",
                                                                    "desc": "Design Thinking kebijakan; co-creation; perancangan & implementasi inovasi."
                                                        }
                                            ]
                                },
                                {
                                            "id": 3,
                                            "title": "Manajemen Stakeholders",
                                            "color": 3,
                                            "topics": [
                                                        {
                                                                    "value": "Stakeholder Engagement (Pelayanan Publik)",
                                                                    "desc": "Membangun engagement; komunikasi stakeholder; kolaborasi & pengelolaan hubungan."
                                                        },
                                                        {
                                                                    "value": "Co-Creation & Collaborative Innovation",
                                                                    "desc": "Co-design solusi pelayanan publik; collaborative problem solving pemerintah & mitra."
                                                        }
                                            ]
                                },
                                {
                                            "id": 4,
                                            "title": "Manajemen Ekosistem Pelayanan Publik",
                                            "color": 4,
                                            "topics": [
                                                        {
                                                                    "value": "Adaptive Governance",
                                                                    "desc": "Pengambilan keputusan adaptif; respons terhadap perubahan; ketidakpastian tata kelola."
                                                        },
                                                        {
                                                                    "value": "Reformasi Birokrasi",
                                                                    "desc": "Transformasi tata kelola; penyederhanaan birokrasi; perubahan budaya kerja."
                                                        },
                                                        {
                                                                    "value": "Manajemen Perubahan (Change Management)",
                                                                    "desc": "Analisis kesiapan organisasi; strategi komunikasi; pengelolaan resistensi perubahan."
                                                        },
                                                        {
                                                                    "value": "Public Sector Innovation",
                                                                    "desc": "Ideasi inovasi pelayanan publik; model implementasi; scaling-up inovasi sektor publik."
                                                        },
                                                        {
                                                                    "value": "Design Thinking",
                                                                    "desc": "Empathize; Define; Ideate; Prototype; dan Testing untuk perbaikan layanan publik."
                                                        }
                                            ]
                                }
                    ]
        };

        const DEFAULT_FORM_CONTENT = {"stepTitles":["Bagian 1: Profil Pegawai","Bagian 2: Kebutuhan Pengembangan Kompetensi","Bagian 3: Preferensi Pelaksanaan","Bagian 4: Knowledge Sharing"],"profile":{"title":"Profil Pegawai","description":"Pilih Unit Organisasi dan Nama Anda. Data NIP, Pangkat/Golongan, Jabatan, Jenjang, dan Masa Kerja akan terisi secara otomatis.","unitLabel":"1. Direktorat / Unit Organisasi","nameLabel":"2. Nama Pegawai","fieldLabels":{"nip":"NIP","rank":"Pangkat / Golongan Ruang","job":"Jabatan","level":"Jenjang / Kategori Jabatan","tenure":"Masa Kerja Organisasi"}},"needs":{"title":"Identifikasi Kebutuhan Pengembangan Kompetensi Pegawai","description":"Pilih topik pelatihan yang dibutuhkan untuk mendukung pelaksanaan tugas Anda. Anda dapat memilih lebih dari satu topik pada setiap subkompetensi, serta menambahkan topik lainnya jika dibutuhkan."},"schedule":{"title":"Preferensi Pelaksanaan & Metode Pelatihan","description":"Tentukan pilihan hari, waktu, serta metode pembelajaran yang paling optimal dan sesuai preferensi Anda.","days":{"label":"1. Pilihan Hari Pelaksanaan","hint":"(Bisa pilih lebih dari satu hari yang sesuai dengan jadwal Anda)","options":["Senin","Selasa","Rabu","Kamis"]},"times":{"label":"2. Preferensi Waktu / Jam Pelaksanaan","hint":"(Bisa pilih lebih dari satu sesi)","options":["Sesi Pagi (08.00 – 12.00 WIB)","Sesi Siang (13.00 – 16.00 WIB)"]},"methods":{"label":"3. Metode Pelatihan yang Diinginkan","hint":"(Bisa pilih lebih dari satu metode)","options":["Offline Learning","Online Learning"],"otherLabel":"Metode Lainnya (Opsional)","otherPlaceholder":"Contoh: Hybrid, Mentoring 1-on-1, Coaching, Belajar Mandiri..."},"strategyLearning":{"label":"Strategi Pembelajaran","hint":"Pilih strategi pembelajaran yang dibutuhkan (bisa lebih dari satu).","required":false,"options":[{"value":"Formal Learning","desc":"Desain kurikulum; pengembangan modul; metode pembelajaran; blended learning; pembelajaran digital; evaluasi pembelajaran."},{"value":"Social Learning","desc":"Knowledge sharing; peer learning; mentoring & coaching; Community of Practice; collaborative learning; benchmarking."},{"value":"Experiential Learning","desc":"Learning by doing; project-based learning; on-the-job learning; job assignment; problem-based learning; simulasi dan refleksi."}]}},"sharing":{"title":"Kesediaan Berbagi Pengetahuan","description":"Pemetaan potensi transfer pengetahuan (Knowledge Sharing / Co-learning) antar pegawai di lingkungan internal Deputi I.","question":"Apakah Anda bersedia berkontribusi sebagai narasumber internal (Knowledge Sharing)?","yesLabel":"Ya, Bersedia","yesHint":"Siap berbagi keahlian/pengalaman teknis","noLabel":"Belum Bersedia","noHint":"Fokus sebagai peserta terlebih dahulu","expertiseLabel":"Bidang keahlian atau pengalaman yang dapat Anda bagikan:","expertiseHint":"Contoh: Best practices analisis regulasi daerah, teknik visualisasi data kebijakan, tips public consultation, dll.","expertisePlaceholder":"Tuliskan bidang keahlian atau pengalaman kerja Anda di sini..."},"customQuestions":[]};
        let formContent = JSON.parse(JSON.stringify(DEFAULT_FORM_CONTENT));

        const COLORS = {
            1: { label: "Biru (Analisis)", border: "border-blue-500", badge: "preview-badge-1", header: "section-header-1", card: "section-color-1", ring: "focus:ring-blue-500", hover: "hover:border-blue-400 hover:bg-blue-50/30", check: "text-blue-600 focus:ring-blue-500" },
            2: { label: "Hijau (Advokasi)", border: "border-emerald-500", badge: "preview-badge-2", header: "section-header-2", card: "section-color-2", ring: "focus:ring-emerald-500", hover: "hover:border-emerald-400 hover:bg-emerald-50/30", check: "text-emerald-600 focus:ring-emerald-500" },
            3: { label: "Kuning (Stakeholder)", border: "border-amber-500", badge: "preview-badge-3", header: "section-header-3", card: "section-color-3", ring: "focus:ring-amber-500", hover: "hover:border-amber-400 hover:bg-amber-50/30", check: "text-amber-600 focus:ring-amber-500" },
            4: { label: "Ungu (Ekosistem)", border: "border-purple-500", badge: "preview-badge-4", header: "section-header-4", card: "section-color-4", ring: "focus:ring-purple-500", hover: "hover:border-purple-400 hover:bg-purple-50/30", check: "text-purple-600 focus:ring-purple-500" }
        };

        // ============================================================
        // RENDER SECTIONS
        // ============================================================
        function renderSections() {
            const container = document.getElementById('sections-container');
            container.innerHTML = surveyData.sections.map((section, sIdx) => {
                const c = COLORS[section.color] || COLORS[1];
                return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden section-card" id="section-card-${sIdx}">
                    <!-- Section Header -->
                    <div class="${c.header} px-5 py-4 border-b border-slate-200">
                        <div class="flex items-start gap-3">
                            <div class="flex-shrink-0 mt-1">
                                <span class="w-8 h-8 rounded-lg bg-white border border-slate-200 shadow-sm flex items-center justify-center text-sm font-extrabold text-slate-600">${sIdx + 1}</span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex flex-col sm:flex-row sm:items-center gap-2 mb-3">
                                    <input type="text" id="sec-title-${sIdx}" value="${escapeAttr(section.title)}" 
                                        class="flex-1 text-base font-bold text-slate-900 bg-transparent border-b-2 border-dashed border-slate-300 focus:border-blue-400 focus:outline-none pb-0.5" 
                                        placeholder="Nama subkompetensi..." oninput="updateSectionTitle(${sIdx}, this.value)">
                                    
                                    <!-- Color Picker -->
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-xs text-slate-500 font-medium">Warna:</span>
                                        ${[1,2,3,4].map(c => `
                                            <button onclick="updateSectionColor(${sIdx}, ${c})" title="${COLORS[c].label}"
                                                class="w-5 h-5 rounded-full transition border-2 ${section.color === c ? 'border-slate-900 scale-110' : 'border-transparent hover:scale-110'} ${['bg-blue-500','bg-emerald-500','bg-amber-500','bg-purple-500'][c-1]}"
                                            ></button>
                                        `).join('')}
                                    </div>

                                    <!-- Delete Section -->
                                    <button onclick="deleteSection(${sIdx})" class="text-xs font-medium text-rose-400 hover:text-rose-600 hover:bg-rose-50 px-2 py-1 rounded-lg transition flex items-center gap-1">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        Hapus Seksi
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Topics List -->
                    <div class="p-5 space-y-3" id="topics-container-${sIdx}">
                        ${section.topics.map((topic, tIdx) => renderTopicRow(sIdx, tIdx, topic)).join('')}
                    </div>

                    <!-- Add Topic Button -->
                    <div class="px-5 pb-5">
                        <button onclick="addTopic(${sIdx})" class="w-full py-2.5 text-xs font-semibold border border-dashed border-slate-300 rounded-xl hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50/20 transition flex items-center justify-center gap-1.5 text-slate-500">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Tambah Topik Pelatihan
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function renderTopicRow(sIdx, tIdx, topic) {
            return `
            <div class="topic-row flex items-start gap-2.5 p-3 rounded-xl border border-slate-100 hover:border-slate-200 hover:bg-slate-50/50 transition group" 
                 id="topic-${sIdx}-${tIdx}" draggable="true"
                 ondragstart="dragStart(event, ${sIdx}, ${tIdx})"
                 ondragover="dragOver(event)"
                 ondrop="dropTopic(event, ${sIdx}, ${tIdx})"
                 ondragleave="dragLeave(event)">

                <!-- Drag Handle -->
                <div class="drag-handle text-slate-300 hover:text-slate-500 pt-2.5 flex-shrink-0" title="Seret untuk mengurutkan">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"></path></svg>
                </div>

                <!-- Topic Number -->
                <span class="flex-shrink-0 w-5 h-5 mt-2.5 rounded-full bg-slate-200 text-slate-600 text-[10px] font-bold flex items-center justify-center">${tIdx + 1}</span>

                <!-- Fields -->
                <div class="flex-1 min-w-0 space-y-1.5">
                    <input type="text" value="${escapeAttr(topic.value)}" placeholder="Nama topik pelatihan..." 
                        class="w-full text-sm font-semibold text-slate-800 border-b border-slate-200 focus:border-blue-400 focus:outline-none bg-transparent pb-0.5"
                        oninput="updateTopic(${sIdx}, ${tIdx}, 'value', this.value)">
                    <input type="text" value="${escapeAttr(topic.desc)}" placeholder="Deskripsi singkat topik (opsional)..." 
                        class="w-full text-xs text-slate-500 border-b border-slate-100 focus:border-slate-300 focus:outline-none bg-transparent pb-0.5"
                        oninput="updateTopic(${sIdx}, ${tIdx}, 'desc', this.value)">
                </div>

                <!-- Delete Topic -->
                <button onclick="deleteTopic(${sIdx}, ${tIdx})" class="flex-shrink-0 p-1.5 rounded-lg text-slate-300 hover:text-rose-500 hover:bg-rose-50 transition opacity-0 group-hover:opacity-100 mt-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>`;
        }

        // ============================================================
        // DATA MUTATIONS
        // ============================================================
        function updateSectionTitle(sIdx, val) { surveyData.sections[sIdx].title = val; }
        function updateSectionColor(sIdx, color) { surveyData.sections[sIdx].color = color; renderSections(); }
        function updateTopic(sIdx, tIdx, field, val) { surveyData.sections[sIdx].topics[tIdx][field] = val; }

        function deleteSection(sIdx) {
            if (!confirm(`Hapus seluruh seksi "${surveyData.sections[sIdx].title}"? Semua topik di dalamnya akan terhapus.`)) return;
            surveyData.sections.splice(sIdx, 1);
            renderSections();
        }

        function addTopic(sIdx) {
            surveyData.sections[sIdx].topics.push({ value: "Topik Baru", desc: "Deskripsi topik..." });
            renderSections();
            // Scroll ke topik baru
            const container = document.getElementById(`topics-container-${sIdx}`);
            if (container) container.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function deleteTopic(sIdx, tIdx) {
            if (surveyData.sections[sIdx].topics.length <= 1) {
                alert("Setiap seksi harus memiliki minimal 1 topik.");
                return;
            }
            surveyData.sections[sIdx].topics.splice(tIdx, 1);
            renderSections();
        }

        function addNewSection() {
            const nextId = (surveyData.sections.length % 4) + 1;
            surveyData.sections.push({
                id: Date.now(),
                title: "Subkompetensi Baru",
                color: nextId,
                topics: [{ value: "Topik Pertama", desc: "Deskripsi topik..." }]
            });
            renderSections();
            document.getElementById(`section-card-${surveyData.sections.length - 1}`)?.scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        // DRAG & DROP
        // ============================================================
        let dragSrc = null;

        function dragStart(e, sIdx, tIdx) {
            dragSrc = { sIdx, tIdx };
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function dragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function dropTopic(e, sIdx, tIdx) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (!dragSrc || (dragSrc.sIdx === sIdx && dragSrc.tIdx === tIdx)) return;

            const srcTopics = surveyData.sections[dragSrc.sIdx].topics;
            const [moved] = srcTopics.splice(dragSrc.tIdx, 1);
            surveyData.sections[sIdx].topics.splice(tIdx, 0, moved);
            dragSrc = null;
            renderSections();
        }

        // ============================================================
        // PREVIEW
        // ============================================================
        function previewSurvey() {
            const title = document.getElementById('survey-title').value;
            const desc = document.getElementById('survey-desc').value;

            const content = document.getElementById('preview-content');
            content.innerHTML = `
                <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 mb-4">
                    <h3 class="font-bold text-slate-900 text-base">${esc(title)}</h3>
                    <p class="text-slate-600 mt-1 text-xs">${esc(desc)}</p>
                </div>
                ${surveyData.sections.map((s, i) => `
                    <div class="border border-slate-200 rounded-xl overflow-hidden">
                        <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-200">
                            <span class="font-bold text-sm text-slate-800">${i+1}. ${esc(s.title)}</span>
                            <span class="ml-2 text-[10px] font-bold px-2 py-0.5 rounded ${COLORS[s.color]?.badge || ''}">${s.topics.length} topik</span>
                        </div>
                        <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${s.topics.map(t => `
                                <div class="border border-slate-200 rounded-lg p-3">
                                    <p class="font-semibold text-slate-800 text-xs">${esc(t.value)}</p>
                                    ${t.desc ? `<p class="text-slate-500 text-[11px] mt-0.5">${esc(t.desc)}</p>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `).join('')}
                ${[
                    [formContent.stepTitles[0], formContent.profile.title, formContent.profile.description, [formContent.profile.unitLabel, formContent.profile.nameLabel]],
                    [formContent.stepTitles[1], formContent.needs.title, formContent.needs.description, []],
                    [formContent.stepTitles[2], formContent.schedule.title, formContent.schedule.description, [...formContent.schedule.days.options, ...formContent.schedule.times.options, ...formContent.schedule.methods.options, formContent.schedule.strategyLearning.label, ...formContent.schedule.strategyLearning.options.map(o=>o.value)]],
                    [formContent.stepTitles[3], formContent.sharing.title, formContent.sharing.description, [formContent.sharing.question, formContent.sharing.yesLabel, formContent.sharing.noLabel, formContent.sharing.expertiseLabel]]
                ].map(([nav, heading, description, items]) => `<div class="border border-slate-200 rounded-xl p-4"><p class="text-[10px] font-bold uppercase tracking-wide text-blue-700">${esc(nav)}</p><h3 class="font-bold text-slate-900 mt-1">${esc(heading)}</h3><p class="text-slate-600 text-xs mt-1 whitespace-pre-line">${esc(String(description||'').replace(/<br\s*\/?>/gi,'\n'))}</p>${items.length ? `<ul class="list-disc pl-5 mt-2 text-xs text-slate-700">${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : ''}</div>`).join('')}
            `;
            document.getElementById('preview-modal').classList.remove('hidden');
        }

        function formField(path, label, value, multiline=false) {
            const encoded = path.join('.');
            const shown = Array.isArray(value) ? value.join('\n') : (value || '');
            return `<label class="block text-xs font-semibold text-slate-600">${esc(label)}${multiline ? `<textarea data-form-path="${encoded}" data-form-lines="true" rows="${path.at(-1)==='options'?4:2}" oninput="updateFormField(this)" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-normal">${esc(shown)}</textarea>` : `<input data-form-path="${encoded}" oninput="updateFormField(this)" value="${escapeAttr(shown)}" class="mt-1 w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-normal">`}</label>`;
        }
        function renderFormContentEditor() {
            const card = (title, fields, badge, step) => `<section class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-6 h-6 rounded-full bg-slate-800 text-white text-xs flex items-center justify-center font-bold">${badge}</span>${title}</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${fields}</div><div class="border-t pt-4 space-y-3"><h3 class="text-sm font-bold text-slate-800">Pertanyaan tambahan</h3><div id="custom-question-editor-${step}" class="space-y-3">${renderCustomQuestionEditor(step)}</div><button type="button" onclick="addCustomQuestion(${step})" class="px-3 py-2 rounded-lg border border-dashed border-blue-300 text-blue-700 text-xs font-semibold hover:bg-blue-50">＋ Tambah pertanyaan</button></div></section>`;
            const f = (path,label,multi=false) => formField(path,label,path.reduce((v,k)=>v?.[k],formContent),multi);
            const strategy=formContent.schedule.strategyLearning;
            const strategyEditor=`<div class="md:col-span-2 border rounded-xl p-4 space-y-3"><h3 class="text-sm font-bold">Strategi Pembelajaran</h3>${f(['schedule','strategyLearning','label'],'Judul pertanyaan')}${f(['schedule','strategyLearning','hint'],'Petunjuk')}
                <label class="text-xs flex items-center gap-2"><input type="checkbox" ${strategy.required?'checked':''} onchange="formContent.schedule.strategyLearning.required=this.checked"> Wajib dijawab</label>
                <div class="space-y-2">${strategy.options.map((o,i)=>`<div class="border rounded-lg p-3 grid grid-cols-1 gap-2"><input value="${escapeAttr(o.value)}" placeholder="Nama strategi" oninput="formContent.schedule.strategyLearning.options[${i}].value=this.value" class="px-3 py-2 border rounded text-sm"><textarea placeholder="Deskripsi / opsi jawaban" oninput="formContent.schedule.strategyLearning.options[${i}].desc=this.value" class="px-3 py-2 border rounded text-xs">${esc(o.desc||'')}</textarea><button type="button" onclick="removeStrategyOption(${i})" class="justify-self-end text-xs text-rose-600">Hapus opsi</button></div>`).join('')}</div><button type="button" onclick="addStrategyOption()" class="px-3 py-2 rounded-lg border border-dashed text-xs font-semibold">＋ Tambah opsi</button></div>`;
            document.getElementById('form-content-editor').innerHTML = [
                card('Bagian 1 · Profil Pegawai', f(['stepTitles',0],'Judul di navigasi')+f(['profile','title'],'Judul bagian')+f(['profile','description'],'Petunjuk bagian',true)+f(['profile','unitLabel'],'Label pertanyaan unit')+f(['profile','nameLabel'],'Label pertanyaan nama')+f(['profile','fieldLabels','nip'],'Label NIP')+f(['profile','fieldLabels','rank'],'Label pangkat/golongan')+f(['profile','fieldLabels','job'],'Label jabatan')+f(['profile','fieldLabels','level'],'Label jenjang jabatan')+f(['profile','fieldLabels','tenure'],'Label masa kerja'),1,1),
                card('Bagian 2 · Kebutuhan Bangkom', f(['stepTitles',1],'Judul di navigasi')+f(['needs','title'],'Judul bagian')+f(['needs','description'],'Petunjuk bagian',true),2,2),
                card('Bagian 3 · Preferensi Pelaksanaan', f(['stepTitles',2],'Judul di navigasi')+f(['schedule','title'],'Judul bagian')+f(['schedule','description'],'Petunjuk bagian',true)+f(['schedule','days','label'],'Pertanyaan hari')+f(['schedule','days','hint'],'Petunjuk hari')+f(['schedule','days','options'],'Pilihan hari (satu per baris)',true)+f(['schedule','times','label'],'Pertanyaan waktu')+f(['schedule','times','hint'],'Petunjuk waktu')+f(['schedule','times','options'],'Pilihan waktu (satu per baris)',true)+f(['schedule','methods','label'],'Pertanyaan metode')+f(['schedule','methods','hint'],'Petunjuk metode')+f(['schedule','methods','options'],'Pilihan metode (satu per baris)',true)+f(['schedule','methods','otherLabel'],'Label opsi lainnya')+f(['schedule','methods','otherPlaceholder'],'Petunjuk isian lainnya')+strategyEditor,3,3),
                card('Bagian 4 · Knowledge Sharing', f(['stepTitles',3],'Judul di navigasi')+f(['sharing','title'],'Judul bagian')+f(['sharing','description'],'Petunjuk bagian',true)+f(['sharing','question'],'Pertanyaan kesediaan')+f(['sharing','yesLabel'],'Pilihan ya')+f(['sharing','yesHint'],'Keterangan pilihan ya')+f(['sharing','noLabel'],'Pilihan tidak')+f(['sharing','noHint'],'Keterangan pilihan tidak')+f(['sharing','expertiseLabel'],'Label bidang keahlian')+f(['sharing','expertiseHint'],'Contoh bidang keahlian',true)+f(['sharing','expertisePlaceholder'],'Placeholder isian bidang keahlian'),4,4)
            ].join('');
        }
        function renderCustomQuestionEditor(step) {
            return (formContent.customQuestions||[]).filter(q=>Number(q.step)===step).map(q=>{
                const idx=formContent.customQuestions.indexOf(q), choice=['checkbox','radio'].includes(q.type);
                return `<div class="border border-slate-200 rounded-xl p-4 space-y-3"><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><label class="text-xs font-semibold">Pertanyaan<input value="${escapeAttr(q.prompt||'')}" oninput="formContent.customQuestions[${idx}].prompt=this.value" class="mt-1 w-full px-3 py-2 border rounded text-sm font-normal"></label><label class="text-xs font-semibold">Keterangan<input value="${escapeAttr(q.description||'')}" oninput="formContent.customQuestions[${idx}].description=this.value" class="mt-1 w-full px-3 py-2 border rounded text-sm font-normal"></label><label class="text-xs font-semibold">Jenis jawaban<select onchange="changeCustomType(${idx},this.value)" class="mt-1 w-full px-3 py-2 border rounded text-sm font-normal"><option value="checkbox" ${q.type==='checkbox'?'selected':''}>Pilihan ganda (bisa pilih banyak)</option><option value="radio" ${q.type==='radio'?'selected':''}>Pilihan tunggal</option><option value="text" ${q.type==='text'?'selected':''}>Isian singkat</option><option value="textarea" ${q.type==='textarea'?'selected':''}>Isian panjang</option></select></label><label class="text-xs font-semibold">Placeholder<input value="${escapeAttr(q.placeholder||'')}" oninput="formContent.customQuestions[${idx}].placeholder=this.value" class="mt-1 w-full px-3 py-2 border rounded text-sm font-normal"></label></div><label class="text-xs flex items-center gap-2"><input type="checkbox" ${q.required?'checked':''} onchange="formContent.customQuestions[${idx}].required=this.checked"> Wajib dijawab</label>${choice?`<div class="space-y-2"><p class="text-xs font-semibold">Opsi jawaban</p>${(q.options||[]).map((opt,oi)=>`<div class="flex gap-2"><input value="${escapeAttr(opt)}" oninput="formContent.customQuestions[${idx}].options[${oi}]=this.value" class="flex-1 px-3 py-2 border rounded text-sm"><button type="button" onclick="removeCustomOption(${idx},${oi})" class="text-rose-600 px-2">Hapus</button></div>`).join('')}<button type="button" onclick="addCustomOption(${idx})" class="px-3 py-2 rounded-lg border border-dashed text-xs font-semibold">＋ Tambah opsi</button></div>`:''}<button type="button" onclick="removeCustomQuestion(${idx})" class="text-xs text-rose-600 font-semibold">Hapus pertanyaan</button></div>`;
            }).join('')||'<p class="text-xs text-slate-500">Belum ada pertanyaan tambahan.</p>';
        }
        function rerenderQuestions(step){ const host=document.getElementById(`custom-question-editor-${step}`); if(host)host.innerHTML=renderCustomQuestionEditor(step); }
        function addCustomQuestion(step){ formContent.customQuestions.push({id:`q_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,step,prompt:'Pertanyaan baru',description:'',type:'checkbox',required:false,options:['Opsi 1','Opsi 2'],placeholder:''}); renderFormContentEditor(); }
        function removeCustomQuestion(idx){const step=Number(formContent.customQuestions[idx].step);formContent.customQuestions.splice(idx,1);rerenderQuestions(step);}
        function changeCustomType(idx,type){formContent.customQuestions[idx].type=type;if(['checkbox','radio'].includes(type)&&!formContent.customQuestions[idx].options?.length)formContent.customQuestions[idx].options=['Opsi 1'];rerenderQuestions(Number(formContent.customQuestions[idx].step));}
        function addCustomOption(idx){formContent.customQuestions[idx].options.push(`Opsi ${formContent.customQuestions[idx].options.length+1}`);rerenderQuestions(Number(formContent.customQuestions[idx].step));}
        function removeCustomOption(idx,oi){formContent.customQuestions[idx].options.splice(oi,1);rerenderQuestions(Number(formContent.customQuestions[idx].step));}
        function addStrategyOption(){formContent.schedule.strategyLearning.options.push({value:'Strategi baru',desc:''});renderFormContentEditor();}
        function removeStrategyOption(i){formContent.schedule.strategyLearning.options.splice(i,1);renderFormContentEditor();}
        function updateFormField(input) {
            const path = input.dataset.formPath.split('.');
            let parent = formContent;
            for (const key of path.slice(0,-1)) parent = parent[key];
            parent[path.at(-1)] = input.dataset.formLines === 'true' ? input.value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean) : input.value;
        }

        const SUPABASE_URL="https://gowleizcsphuydbuhfoy.supabase.co";
        const SUPABASE_ANON_KEY="sb_publishable_iYfTy-1HABdhlGGMhB8AqA_4lO3Harp";
        const adminSupabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        let adminSession=null;
        function setAdminSession(session){adminSession=session;document.getElementById('admin-login').classList.toggle('hidden',!!session);document.getElementById('admin-session').classList.toggle('hidden',!session);document.getElementById('admin-logout').classList.toggle('hidden',!session);const b=document.getElementById('save-config-button');b.disabled=!session;b.classList.toggle('opacity-50',!session);b.classList.toggle('cursor-not-allowed',!session);document.getElementById('admin-session').textContent=session?.user?.email||'';}
        async function signInAdmin(event) {
            event.preventDefault();
            const { data, error } = await adminSupabase.auth.signInWithPassword({
                email: document.getElementById('admin-email').value.trim(),
                password: document.getElementById('admin-password').value
            });
            if (error) { alert('Login gagal: ' + error.message); return; }
            const { data: isAdmin } = await adminSupabase.rpc('is_survey_admin');
            if (!isAdmin) {
                await adminSupabase.auth.signOut();
                setAdminSession(null);
                alert('Akun ini belum didaftarkan sebagai admin survei.');
                return;
            }
            setAdminSession(data.session);
        }
        async function signOutAdmin(){await adminSupabase.auth.signOut();setAdminSession(null)}
        function mergeConfigDefaults(base, saved) {
            for(const [key,value] of Object.entries(saved||{})) base[key]=value&&typeof value==='object'&&!Array.isArray(value)?mergeConfigDefaults(base[key]&&typeof base[key]==='object'?base[key]:{},value):value;
            return base;
        }
        async function loadAdminState() {
            const { data: { session } } = await adminSupabase.auth.getSession();
            if (session) {
                const { data: isAdmin } = await adminSupabase.rpc('is_survey_admin');
                setAdminSession(isAdmin ? session : null);
            } else {
                setAdminSession(null);
            }
            const { data, error } = await adminSupabase.from('survey_config').select('config').eq('id', 'active').maybeSingle();
            if (!error && data?.config) {
                surveyData = { sections: data.config.sections || [] };
                formContent = mergeConfigDefaults(JSON.parse(JSON.stringify(DEFAULT_FORM_CONTENT)), data.config.formContent || {});
                renderFormContentEditor();
                document.getElementById('survey-title').value = data.config.surveyTitle || '';
                document.getElementById('survey-desc').value = String(data.config.surveyDesc || '').replace(/<br\s*\/?>/gi, '\n');
                renderSections();
            }
        }
        async function applyChanges(){if(!adminSession){alert('Silakan login admin terlebih dahulu.');return}surveyData.sections.forEach((s,i)=>{const input=document.getElementById(`sec-title-${i}`);if(input)s.title=input.value.trim()});const config={surveyTitle:document.getElementById('survey-title').value.trim(),surveyDesc:document.getElementById('survey-desc').value.trim(),sections:surveyData.sections,formContent};if(!config.surveyTitle||!config.sections.length||config.sections.some(s=>!s.title||!s.topics.length||s.topics.some(t=>!t.value.trim()))||[formContent.schedule.days.options,formContent.schedule.times.options,formContent.schedule.methods.options,formContent.schedule.strategyLearning.options.map(o=>o.value.trim())].some(list=>!list.length)||formContent.customQuestions.some(q=>!q.prompt.trim()||(['checkbox','radio'].includes(q.type)&&(!q.options.length||q.options.some(o=>!o.trim()))))){alert('Judul, nama subkompetensi, dan minimal satu topik per subkompetensi wajib diisi.');return}const b=document.getElementById('save-config-button');b.disabled=true;b.textContent='Menyimpan…';const {error}=await adminSupabase.from('survey_config').upsert({id:'active',config,updated_at:new Date().toISOString()});b.disabled=false;b.textContent='Simpan & Terapkan';if(error){alert('Gagal menyimpan: '+error.message);return}showToast('Tersimpan. Survei live menggunakan konfigurasi baru.')}
        function exportConfig() {
            surveyData.sections.forEach((s, sIdx) => {
                const titleEl = document.getElementById(`sec-title-${sIdx}`);
                if (titleEl) s.title = titleEl.value;
            });
            const config = {
                surveyTitle: document.getElementById('survey-title').value,
                surveyDesc: document.getElementById('survey-desc').value,
                sections: surveyData.sections,
                formContent
            };
            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `survey-config-${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('File konfigurasi JSON berhasil diunduh!');
        }

        // ============================================================
        // HELPERS
        // ============================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function escapeAttr(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function escHTML(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function esc(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // Init
        document.addEventListener('DOMContentLoaded', async () => { renderSections(); renderFormContentEditor(); await loadAdminState(); });
    </script>
